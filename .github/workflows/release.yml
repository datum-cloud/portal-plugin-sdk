name: Release

# Changesets flow on every push to main:
#   version  - pending changesets: open or update the "Version Packages" PR.
#   pack     - the version in package.json is not on npm yet (the Version PR
#              merged, or a version was bumped by hand): build, test and pack
#              the tarball. No publish credentials.
#   publish  - stage exactly that tarball on npm, and draft its GitHub Release.
#
# npm trusted publishing (OIDC) is the only npm credential: there is no token
# anywhere, and setup-node has no registry auth URL. npm trusts this workflow
# by repository and workflow FILENAME, so renaming or moving release.yml
# silently breaks publishing. The trusted publisher is configured on npmjs.com
# under the package's settings, with the "npm stage publish" permission: CI
# can only stage a version, and a maintainer approves it with 2FA
# (`npm stage approve <id>`, or on npmjs.com) before it goes public. Publish
# the drafted GitHub Release once the version is live. npm does not list a
# staged version until it is approved, so the draft Release marks a version as
# staged: a push to main while it awaits approval does not stage it again.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Open the Version Packages PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          commitMode: github-api
          version: pnpm exec changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      name: ${{ steps.check.outputs.name }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version new to npm?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.check.outputs.publish == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 26
          cache: pnpm
      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: pnpm typecheck
      - if: steps.check.outputs.publish == 'true'
        run: pnpm build
      - if: steps.check.outputs.publish == 'true'
        run: pnpm test
      - name: Pack
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p out
          npm pack --pack-destination out
          node scripts/release-notes.mjs "$VERSION" > out/release-notes.md
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.publish == 'true'
        with:
          name: package
          path: out/
          if-no-files-found: error

  publish:
    name: Stage on npm
    runs-on: ubuntu-latest
    needs: pack
    if: needs.pack.outputs.publish == 'true'
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.pack.outputs.name }}@${{ needs.pack.outputs.version }}
    steps:
      - name: Is this version already staged?
        id: staged
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub Release, so it was staged by an earlier run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.staged.outputs.skip == 'false'
        with:
          name: package
          path: out
      - uses: actions/setup-node@v4
        if: steps.staged.outputs.skip == 'false'
        with:
          node-version: 26
      - if: steps.staged.outputs.skip == 'false'
        run: npm install -g npm@^12
      - name: Stage the packed tarball
        if: steps.staged.outputs.skip == 'false'
        # The ./ matters: npm reads a bare "out/x.tgz" as a GitHub user/repo
        # shorthand and refuses it (EALLOWGIT), not as a local file.
        run: npm stage publish ./out/*.tgz --access public --provenance
      - name: Draft the GitHub Release
        if: steps.staged.outputs.skip == 'false'
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file out/release-notes.md \
            --draft
